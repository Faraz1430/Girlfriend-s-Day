<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Treasure Inside</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>

body{
    opacity:0;

    animation:fadeInPage 0.8s ease forwards;

    min-height:100vh;

    background:
    radial-gradient(
        circle at center,
        #a06a42 0%,
        #6b472b 50%,
        #3d2618 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;
}
@keyframes fadeInPage{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}
.paper{

    max-width:700px;

    background:
    linear-gradient(
        #f2dfb4,
        #e8d0a1
    );

    padding:60px;

    border-radius:10px;

    text-align:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.3);
}
.paper::before,
.paper::after{
    content:"❦";
    position:absolute;
    font-size:4rem;
    color:rgba(120,85,50,.15);
}

.paper::before{
    top:15px;
    left:20px;
}

.paper::after{
    bottom:15px;
    right:20px;
}
.line{
    opacity:0;
    transform:translateY(20px);

    animation:fadeIn 1.5s forwards;
}

.line2{ animation-delay:1.5s; }
.line3{ animation-delay:3s; }
.line4{ animation-delay:4.5s; }
.line5{ animation-delay:6s; }
.line6{ animation-delay:7.5s; 
font-size:2.6rem;
    color:#7a2d2d;}
.line7{ animation-delay:9s; }
.line8{ animation-delay:10.5s;
font-size:2.6rem;
    color:#7a2d2d; }
.line9{ animation-delay:12s; }

@keyframes fadeIn{

    to{
        opacity:1;
        transform:translateY(0);
    }

}
h1{
    font-family:'Caveat',cursive;
    font-size:4.5rem;
    color:#5b3b23;

    text-shadow:
        0 0 12px rgba(255,220,150,.35);
}
h2{
    font-family:'Marck Script',cursive;
    font-size:2.8rem;
    color:#6b472b;
    margin:25px 0;
}

p{
    font-family:'Marck Script',cursive;
    font-size:2rem;
    color:#3d2a1b;
    line-height:1.8;
}

.signature{
    margin-top:50px;
    text-align:right;

    font-family:'Caveat',cursive;
    font-size:3rem;

    color:#5b3b23;
}
.chest{
    font-size:6rem;

    animation:floatChest 3s ease-in-out infinite;

    filter:drop-shadow(
        0 0 15px rgba(255,220,150,.5)
    );
}

@keyframes floatChest{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}
.treasure-card{
    max-width:800px;

    background:
    linear-gradient(
        #f2dfb4,
        #e8d0a1
    );

    padding:50px;

    border-radius:10px;

    border:2px solid rgba(120,85,50,.2);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);

    text-align:center;

    position:relative;
}

.treasure-card h1{
    font-family:'Caveat',cursive;
    font-size:4rem;
    color:#5b3b23;
}

.treasure-card h2{
    margin:20px 0;
    color:#7a4f2d;
}

.treasure-card p{
    color:#4b3621;
    line-height:1.8;
    font-size:1.1rem;
}
</style>
</head>
<body>
<div class="paper">


<h1 class="line">Treasure Found!!</h1>

<h2 class="line line2">
    Congratulations.
</h2>

<p class="line line3">
    You've reached the end of this little journey.
</p>

<p class="line line4">
    Out of all my favorite memories,
</p>

<p class="line line5">
    my favorite part was never the places, the photos, or the moments.
</p>

<p class="line line6">
    It was always you, Samriddhi. You are The Treasure ❤️
</p>

<div class="signature line line7">
    — Faraz ❤️
</div>

</div>

</body>
</html>
